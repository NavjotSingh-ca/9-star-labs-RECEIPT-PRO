name: Supabase Keep-Alive Ping

on:
  schedule:
    # Run every 3 days at 6am UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping ping. Define it in GitHub repo Settings > Secrets > Actions."
            exit 0
          fi
          echo "Pinging $SITE_URL/api/health ..."
          HTTP_RESPONSE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" --max-time 15 "$SITE_URL/api/health")
          echo "HTTP status: $HTTP_RESPONSE"
          if [ -f /tmp/health_response.json ]; then
            echo "Response body:"
            cat /tmp/health_response.json | python3 -m json.tool 2>/dev/null || cat /tmp/health_response.json
          fi
          case "$HTTP_RESPONSE" in
            2??)
              echo "Health check passed."
              ;;
            503)
              echo "WARNING: Service degraded (503) — this is normal if optional services (Stripe, Resend) are not configured."
              ;;
            *)
              echo "WARNING: Unexpected response $HTTP_RESPONSE — check the health endpoint logs."
              ;;
          esac
