name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0
  NEXT_PUBLIC_SITE_URL: https://leduc-receipt-pro.vercel.app
  SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leduc-receipt-pro
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CI: true
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate SQL schema against Postgres 17
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d leduc-receipt-pro -f supabase/consolidated-setup.sql
        env:
          PGPASSWORD: postgres
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings 0
      - run: npm run test:unit -- --passWithNoTests

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      CI: true
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx audit-ci --config audit-ci.json

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start Supabase Local (full stack: API, Auth, Postgres)
        run: |
          docker run -d \
            --name supabase \
            -p 54321:54321 \
            -p 54322:54322 \
            -e POSTGRES_PASSWORD=postgres \
            -e JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters \
            -e ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            -e SERVICE_ROLE_KEY=${{ env.SUPABASE_SERVICE_ROLE_KEY }} \
            -v ${{ github.workspace }}/supabase/consolidated-setup.sql:/docker-entrypoint-initdb.d/setup.sql \
            supabase/supabase-local:v2.101.1

      - name: Wait for Supabase (Postgres + API)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 54322 -U postgres 2>/dev/null; then
              echo "Postgres ready"
              sleep 5
              break
            fi
            echo "Attempt $i/30..."
            sleep 3
          done
          echo "Waiting for API..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:54321/health > /dev/null 2>&1; then
              echo "API ready"
              break
            fi
            echo "Attempt $i/20..."
            sleep 3
          done

      - name: Create test user for aXe tests
        run: |
          PGPASSWORD=postgres psql -h localhost -p 54322 -U postgres <<'SQL'
          -- Create test user (auto-confirmed)
          INSERT INTO auth.users (id, instance_id, email, encrypted_password, email_confirmed_at, confirmation_sent_at, raw_user_meta_data, created_at, updated_at, aud, role)
          SELECT gen_random_uuid(), '00000000-0000-0000-0000-000000000000', 'test@leducreceiptpro.com', crypt('test123456', gen_salt('bf')), now(), now(), '{"full_name": "Test User"}', now(), now(), 'authenticated', 'authenticated'
          WHERE NOT EXISTS (SELECT 1 FROM auth.users WHERE email = 'test@leducreceiptpro.com');

          -- Add identity record
          INSERT INTO auth.identities (id, user_id, identity_data, provider, created_at, updated_at, last_sign_in_at)
          SELECT gen_random_uuid(), id, jsonb_build_object('sub', id::text, 'email', email), 'email', now(), now(), now()
          FROM auth.users WHERE email = 'test@leducreceiptpro.com'
          AND NOT EXISTS (SELECT 1 FROM auth.identities WHERE user_id = auth.users.id);
          SQL

      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e -- --project=chromium
        env:
          CI: true