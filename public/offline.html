<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leduc Receipt Pro — Offline</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --champagne: #bea98e;
      --champagne-dim: #8b7355;
      --surface: #f5f5f4;
      --text-primary: #09090b;
      --text-muted: #71717a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #0c0c0c;
        --text-primary: #fafafa;
        --text-muted: #a1a1aa;
      }
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--surface);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }

    .brand-mark {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .brand-mark svg {
      width: 48px;
      height: 48px;
      display: block;
    }

    .brand-mark::after {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--champagne), var(--champagne-dim));
      opacity: 0.08;
      z-index: -1;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    p {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
      max-width: 24rem;
    }

    .offline-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(190, 169, 142, 0.1);
      color: var(--champagne-dim);
      padding: 0.375rem 1rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid rgba(190, 169, 142, 0.2);
    }

    .offline-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--champagne);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .separator {
      width: 2rem;
      height: 1px;
      background: rgba(190, 169, 142, 0.2);
      margin: 1rem 0;
    }

    script { display: none; }

    @media (prefers-color-scheme: dark) {
      .offline-badge {
        color: var(--champagne);
      }
    }
  </style>
</head>
<body>
  <div class="brand-mark">
    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 64 64">
      <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="var(--champagne)" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M38 4 L38 14 Q38 22 46 22 L60 22" fill="none" stroke="var(--champagne)" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="16" y1="30" x2="48" y2="30" stroke="var(--champagne)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="16" y1="38" x2="40" y2="38" stroke="var(--champagne)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M44 48 L50 54 L58 42" fill="none" stroke="var(--champagne)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>You're Offline</h1>
  <p>Your receipts are saved locally and will sync automatically when you reconnect.</p>

  <div class="separator"></div>

  <span class="offline-badge">Offline Mode Active</span>

  <script>
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
