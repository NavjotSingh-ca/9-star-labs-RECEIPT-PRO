<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leduc Receipt Pro — Offline</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9fa;
      color: #212529;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #6c757d;
      margin-bottom: 1.5rem;
    }
    .offline-badge {
      background: #e9ecef;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="icon">📱</div>
  <h1>You're Offline</h1>
  <p>Your receipts are saved locally and will sync when you reconnect.</p>
  <span class="offline-badge">Offline Mode Active</span>

  <script>
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
