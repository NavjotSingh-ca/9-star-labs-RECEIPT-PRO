<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <style>
      .receipt-body { fill: none; stroke-width: 3.5; stroke-linejoin: round; }
      .receipt-fold { fill: none; stroke-width: 3.5; stroke-linejoin: round; }
      .receipt-line { fill: none; stroke-width: 2.5; stroke-linecap: round; }
      .checkmark { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .stroke { stroke: #8b7355; }
      @media (prefers-color-scheme: dark) {
        .stroke { stroke: #bea98e; }
      }
    </style>
  </defs>
  <!-- Receipt body -->
  <rect class="receipt-body stroke" x="4" y="4" width="56" height="56" rx="10"/>
  <!-- Receipt fold (top-right corner) -->
  <path class="receipt-fold stroke" d="M38 4 L38 14 Q38 22 46 22 L60 22"/>
  <!-- Receipt horizontal lines -->
  <line class="receipt-line stroke" x1="16" y1="30" x2="48" y2="30"/>
  <line class="receipt-line stroke" x1="16" y1="38" x2="40" y2="38"/>
  <!-- Checkmark -->
  <path class="checkmark stroke" d="M44 48 L50 54 L58 42"/>
</svg>
